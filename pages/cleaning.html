<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cleaning Management - Hotel Management System</title>
    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/components/navigation.css" />
    <link rel="stylesheet" href="../css/components/cleaning.css" />
  </head>
  <body>
    <nav class="main-nav">
      <div class="nav-container">
        <h1>
          <a href="../index.html" class="home-link">Hotel Management System</a>
        </h1>
        <ul class="nav-links">
          <li><a href="reservations.html">Reservations</a></li>
          <li>
            <a href="cleaning.html" class="active">Cleaning Management</a>
          </li>
          <li>
            <button id="darkModeToggle">
              <i class="fas fa-moon"></i> Dark Mode
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container">
      <div class="cleaning-dashboard">
        <div class="filters">
          <select id="floorFilter" class="filter-select">
            <option value="all">All Floors</option>
            <!-- Will be populated by JavaScript -->
          </select>
          <select id="statusFilter" class="filter-select">
            <option value="all">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
          <select id="assignedToFilter" class="filter-select">
            <option value="all">All Staff</option>
            <!-- Will be populated by JavaScript -->
          </select>
        </div>

        <div class="rooms-grid" id="roomsGrid">
          <!-- Will be populated by JavaScript -->
        </div>
      </div>
    </main>

    <!-- JavaScript Files -->
    <script src="../js/components/cleaning.js"></script>
  </body>
</html>
